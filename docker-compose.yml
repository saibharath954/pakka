# Optional: self-hosted Hindsight. Hindsight Cloud is the easier path (see README).
# Groq's FREE tier is too small for Hindsight's own extraction calls; use a paid key
# or another provider (HINDSIGHT_API_LLM_PROVIDER=openai, gemini, ...).
#   GROQ_API_KEY=gsk_... docker compose up
# API on :8888, Hindsight's own UI on :9999 (handy on screen during a demo).
services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    ports: ["8888:8888", "9999:9999"]
    environment:
      HINDSIGHT_API_LLM_PROVIDER: groq
      HINDSIGHT_API_LLM_API_KEY: ${GROQ_API_KEY}
      HINDSIGHT_API_LLM_MODEL: openai/gpt-oss-120b
    volumes: ["hindsight-data:/home/hindsight/.pg0"]
volumes:
  hindsight-data:
